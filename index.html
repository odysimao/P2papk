    /* ---------------- Anillo de custodia ---------------- */
    function CustodyRing({ pct = 70, size = 64, stroke = 6, color = C.blue, track = C.borderSoft, children }) {
      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      const offset = c - (pct / 100) * c;
      return (
        <div style={{ width: size, height: size, position: "relative" }}>
          <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
            <circle cx={size / 2} cy={size / 2} r={r} stroke={track} strokeWidth={stroke} fill="none" />
            <circle
              cx={size / 2} cy={size / 2} r={r} stroke={color} strokeWidth={stroke} fill="none"
              strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
              style={{ transition: "stroke-dashoffset 0.6s ease" }}
            />
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
            {children}
          </div>
        </div>
      );
    }

                style={{ width: 56, cursor: 'pointer', background: 'none', border: 'none' }}
              >
                <NavIcon size={18} color={isActive ? C.blue : C.textFaint} strokeWidth={isActive ? 2.4 : 2} />
                <span className="font-body" style={{ fontSize: 9.5, color: isActive ? C.blue : C.textFaint, fontWeight: isActive ? 600 : 400 }}>
                  {it.label}
                </span>
              </button>
            );
          })}
        </div>
      );
    }

    /* =========================================================
       APP RAÍZ
    ========================================================= */
    function App() {
      const [screen, setScreen] = useState("inicio");

      const screens = {
        inicio: <ScreenInicio goTo={setScreen} />,
        mercado: <ScreenMercado goTo={setScreen} />,
        operacion: <ScreenOperacion />,
        billetera: <ScreenBilletera />,
        perfil: <ScreenPerfil />,
      };

      return (
        <div
          className="w-full min-h-screen flex items-center justify-center py-10"
          style={{ background: "#05070A" }}
        >
          <div className="flex flex-col items-center">
            {/* Marco del teléfono */}
            <div
              className="relative"
              style={{
                width: 390, 
                height: 844, 
                borderRadius: 46, 
                background: C.bg,
                border: "10px solid #000", 
                boxShadow: "0 30px 80px rgba(0,0,0,0.6)",
                overflow: "hidden",
              }}
            >
              <GridBackdrop />
              {/* Notch */}
              <div
                style={{
                  position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)",
                  width: 120, height: 26, background: "#000", borderBottomLeftRadius: 16, borderBottomRightRadius: 16, zIndex: 20,
                }}
              />
              <div className="relative flex flex-col h-full" style={{ zIndex: 10 }}>
                <StatusBar />
                <BrandHeader />
                <div className="flex-1 overflow-y-auto" style={{ scrollbarWidth: 'none', msOverflowStyle: 'none' }}>
                  {screens[screen]}
                </div>
                <BottomNav active={screen} goTo={setScreen} />
              </div>
            </div>

            <p className="font-body mt-5" style={{ color: "#4A5262", fontSize: 12, textAlign: "center", maxWidth: 340 }}>
              Maqueta interactiva · Toca los íconos inferiores o los accesos de Inicio para navegar entre pantallas
            </p>
          </div>
        </div>
      );
    }

    // Renderizar la aplicación
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

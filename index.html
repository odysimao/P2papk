<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmo Link - Link P2P</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    
    :root {
      --bg: #0A0D12;
      --surface: #12161F;
      --surface2: #171C26;
      --border: #232A36;
      --borderSoft: #1A2029;
      --red: #E5484D;
      --redSoft: #3A1B1D;
      --blue: #3B82F6;
      --blueSoft: #152540;
      --green: #22C55E;
      --greenSoft: #12291B;
      --amber: #E5A93B;
      --text: #F3F5F8;
      --textDim: #8D96A5;
      --textFaint: #565F6D;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #05070A;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Contenedor principal */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* Marco del teléfono */
    .phone-frame {
      position: relative;
      width: 390px;
      height: 844px;
      background: var(--bg);
      border: 10px solid #000;
      border-radius: 46px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    
    /* Grid de fondo */
    .grid-backdrop {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: 
        linear-gradient(var(--borderSoft) 1px, transparent 1px),
        linear-gradient(90deg, var(--borderSoft) 1px, transparent 1px);
      background-size: 22px 22px;
      opacity: 0.35;
      mask-image: radial-gradient(ellipse 100% 60% at 50% 0%, black 40%, transparent 90%);
      -webkit-mask-image: radial-gradient(ellipse 100% 60% at 50% 0%, black 40%, transparent 90%);
    }
    
    /* Notch */
    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 26px;
      background: #000;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 20;
    }
    
    /* Contenido del teléfono */
    .phone-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    /* Barra de estado */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px 4px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      font-size: 12px;
    }
    
    .status-icons {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    /* Encabezado de marca */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 20px 12px;
    }
    
    .brand-logo {
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, var(--blue), var(--red));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }
    
    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      letter-spacing: 0.5px;
      color: var(--text);
      font-weight: 600;
    }
    
    .brand-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--textFaint);
    }
    
    /* Área de contenido scrolleable */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 24px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    
    .screen-content::-webkit-scrollbar {
      display: none;
    }
    
    /* Barra de navegación inferior */
    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 8px 8px 22px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 56px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    
    .nav-item span {
      font-size: 9.5px;
      color: var(--textFaint);
      font-weight: 400;
    }
    
    .nav-item.active span {
      color: var(--blue);
      font-weight: 600;
    }
    
    /* Iconos SVG */
    .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    
    .nav-item .icon {
      width: 18px;
      height: 18px;
    }
    
    /* Componentes comunes */
    .status-chip {
      display: inline-flex;
      align-items: center;
      border-radius: 9999px;
      padding: 2px 8px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    
    .btn-primary {
      background: var(--blue);
      color: #fff;
      border: none;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
    }
    
    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
    }
    
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .items-baseline { align-items: baseline; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .flex-1 { flex: 1; }
    .gap-1 { gap: 4px; }
    .gap-1-5 { gap: 6px; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .gap-5 { gap: 20px; }
    
    .grid { display: grid; }
    .grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
    
    .text-center { text-align: center; }
    .text-left { text-align: left; }
    .text-right { text-align: right; }
    
    .relative { position: relative; }
    .absolute { position: absolute; }
    .overflow-hidden { overflow: hidden; }
    
    .rounded-lg { border-radius: 8px; }
    .rounded-xl { border-radius: 12px; }
    .rounded-2xl { border-radius: 20px; }
    .rounded-full { border-radius: 50%; }
    
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
    .mt-5 { margin-top: 20px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-4 { margin-bottom: 16px; }
    .mb-5 { margin-bottom: 20px; }
    
    .caption {
      position: relative;
      z-index: 30;
      color: #4A5262;
      font-size: 12px;
      text-align: center;
      max-width: 340px;
      margin-top: 20px;
    }
    
    /* Anillo de custodia */
    .custody-ring {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    
    .custody-ring svg {
      transform: rotate(-90deg);
    }
    
    .custody-ring-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="phone-frame">
      <div class="grid-backdrop"></div>
      <div class="notch"></div>
      <div class="phone-content">
        <div class="status-bar">
          <span>9:41</span>
          <div class="status-icons">
            <!-- Iconos de señal, wifi y batería -->
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></svg>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"/><line x1="23" y1="13" x2="23" y2="11"/></svg>
          </div>
        </div>
        
        <div class="brand-header">
          <div class="brand-logo">C</div>
          <span class="brand-name">Cosmo Link</span>
          <span class="brand-tag">· Link P2P</span>
        </div>
        
        <div class="screen-content" id="screen-content">
          <!-- El contenido se renderiza aquí dinámicamente -->
        </div>
        
        <div class="bottom-nav" id="bottom-nav">
          <!-- La navegación se renderiza aquí dinámicamente -->
        </div>
      </div>
    </div>
    
    <p class="caption">
      Maqueta interactiva · Toca los íconos inferiores o los accesos de Inicio para navegar entre pantallas
    </p>
  </div>

  <script>
    // ============================================================
    // ICONOS SVG
    // ============================================================
    const icons = {
      home: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
      store: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M3 9h18"/><path d="M9 20v-6h6v6"/></svg>',
      refresh: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
      wallet: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>',
      user: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      bell: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
      shieldCheck: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>',
      shieldAlert: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
      arrowUpRight: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>',
      arrowDownRight: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 7 17 17 7 17"/></svg>',
      chevronRight: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
      messageCircle: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
      copy: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      checkCircle: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>',
      clock: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
      filter: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>',
      lock: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
      unlock: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>',
      megaphone: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>',
      fingerprint: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>',
      settings: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>',
      logOut: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
    };
    
    // ============================================================
    // UTILIDADES
    // ============================================================
    const C = {
      bg: "#0A0D12",
      surface: "#12161F",
      surface2: "#171C26",
      border: "#232A36",
      borderSoft: "#1A2029",
      red: "#E5484D",
      redSoft: "#3A1B1D",
      blue: "#3B82F6",
      blueSoft: "#152540",
      green: "#22C55E",
      greenSoft: "#12291B",
      amber: "#E5A93B",
      text: "#F3F5F8",
      textDim: "#8D96A5",
      textFaint: "#565F6D",
    };
    
    function custodyRing(pct, size, stroke, color, track, content) {
      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      const offset = c - (pct / 100) * c;
      return `
        <div class="custody-ring" style="width:${size}px;height:${size}px;">
          <svg width="${size}" height="${size}">
            <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${track}" stroke-width="${stroke}" fill="none"/>
            <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
              stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"
              style="transition: stroke-dashoffset 0.6s ease"/>
          </svg>
          <div class="custody-ring-content">${content}</div>
        </div>
      `;
    }
    
    function statusChip(label, tone) {
      const map = {
        blue: { bg: C.blueSoft, fg: C.blue },
        red: { bg: C.redSoft, fg: C.red },
        green: { bg: C.greenSoft, fg: C.green },
        amber: { bg: "#2E250F", fg: C.amber },
        gray: { bg: C.surface2, fg: C.textDim },
      };
      const t = map[tone] || map.gray;
      return `<span class="status-chip" style="background:${t.bg};color:${t.fg}">${label}</span>`;
    }
    
    // ============================================================
    // PANTALLAS
    // ============================================================
    function screenInicio() {
      const actividad = [
        { nick: "MayelinCUP", tipo: "Compra", monto: "250.00 USDT", estado: "Liberado", tono: "green", icon: 'arrowDownRight' },
        { nick: "Ody_Pro", tipo: "Venta", monto: "120.00 USDT", estado: "En curso", tono: "blue", icon: 'clock' },
        { nick: "Havana_Trade", tipo: "Venta", monto: "80.00 USDT", estado: "Cancelada", tono: "red", icon: 'arrowUpRight' },
      ];
      
      let actividadHTML = '';
      actividad.forEach(a => {
        actividadHTML += `
          <button class="card rounded-xl flex items-center gap-3 mb-2" style="width:100%;padding:12px;cursor:pointer;border:1px solid ${C.border};background:${C.surface}" onclick="navigate('operacion')">
            <div class="flex items-center justify-center rounded-full" style="width:34px;height:34px;background:${C.bg};border:1px solid ${C.borderSoft}">
              <span style="color:${C.textDim}">${icons[a.icon]}</span>
            </div>
            <div class="flex-1 text-left">
              <p style="color:${C.text};font-size:12.5px;font-weight:600">${a.tipo} · ${a.nick}</p>
              <p style="color:${C.textDim};font-size:11px;font-family:'JetBrains Mono',monospace">${a.monto}</p>
            </div>
            ${statusChip(a.estado, a.tono)}
          </button>
        `;
      });
      
      return `
        <div class="flex items-center justify-between mb-4">
          <div>
            <p style="color:${C.textDim};font-size:12px">Bienvenido de nuevo</p>
            <div class="flex items-center gap-1-5">
              <h1 class="font-display" style="color:${C.text};font-size:19px;font-weight:600">Ody_Pro</h1>
              <span style="color:${C.green}">${icons.shieldCheck}</span>
            </div>
          </div>
          <button class="flex items-center justify-center rounded-full" style="width:36px;height:36px;background:${C.surface};border:1px solid ${C.border};cursor:pointer">
            <span style="color:${C.textDim}">${icons.bell}</span>
          </button>
        </div>
        
        <div class="rounded-2xl relative overflow-hidden mb-4" style="background:linear-gradient(160deg, ${C.surface2} 0%, ${C.surface} 70%);border:1px solid ${C.border};padding:20px">
          <div style="position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle, ${C.blue}22, transparent 70%)"></div>
          <p style="color:${C.textDim};font-size:11.5px">Balance total</p>
          <div class="flex items-baseline gap-2 mt-1">
            <span class="font-display" style="color:${C.text};font-size:32px;font-weight:700">5,000.00</span>
            <span style="color:${C.textDim};font-size:13px;font-family:'JetBrains Mono',monospace">USDT</span>
          </div>
          <div class="flex items-center gap-1-5 mt-1">
            <span style="color:${C.amber};font-size:12px;font-family:'JetBrains Mono',monospace">0.084 BNB</span>
            <span style="color:${C.textFaint};font-size:11px">· gas disponible</span>
